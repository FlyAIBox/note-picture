<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="65" text-anchor="middle" font-family="SimSun, serif" font-size="40" font-weight="bold" fill="#333333">AI 时代企业认知升级总览图</text>
  <text x="800" y="102" text-anchor="middle" font-family="SimSun, serif" font-size="22" fill="#888888">五个维度的重新想象</text>

  <!-- Central node -->
  <ellipse cx="800" cy="450" rx="150" ry="90" fill="#D2D2E0" stroke="#8A8AAE" stroke-width="2.5"/>
  <text x="800" y="440" text-anchor="middle" font-family="SimSun, serif" font-size="24" font-weight="bold" fill="#333333">AI 时代</text>
  <text x="800" y="472" text-anchor="middle" font-family="SimSun, serif" font-size="24" font-weight="bold" fill="#333333">认知升级</text>

  <!-- Branch 1: 基础设施认知 (top-left, blue) -->
  <line x1="670" y1="400" x2="420" y2="230" stroke="#5C90A8" stroke-width="2"/>
  <rect x="150" y="150" width="340" height="120" rx="12" fill="#C4DCE6" stroke="#5C90A8" stroke-width="2"/>
  <text x="320" y="188" text-anchor="middle" font-family="SimSun, serif" font-size="21" font-weight="bold" fill="#333333">基础设施认知</text>
  <text x="320" y="220" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">AI 如水电煤，Token 是</text>
  <text x="320" y="245" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">计量单位</text>

  <!-- Branch 2: 价值判断 (top-right, red) -->
  <line x1="930" y1="400" x2="1180" y2="230" stroke="#C97878" stroke-width="2"/>
  <rect x="1110" y="150" width="340" height="120" rx="12" fill="#FFBFBF" stroke="#C97878" stroke-width="2"/>
  <text x="1280" y="188" text-anchor="middle" font-family="SimSun, serif" font-size="21" font-weight="bold" fill="#333333">价值判断标准</text>
  <text x="1280" y="220" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">敢用贵模型，本质是</text>
  <text x="1280" y="245" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">敢做高价值的事</text>

  <!-- Branch 3: 工程范式 (left, yellow) -->
  <line x1="655" y1="470" x2="380" y2="530" stroke="#C9A227" stroke-width="2"/>
  <rect x="130" y="470" width="340" height="120" rx="12" fill="#FBE7A6" stroke="#C9A227" stroke-width="2"/>
  <text x="300" y="508" text-anchor="middle" font-family="SimSun, serif" font-size="21" font-weight="bold" fill="#333333">工程范式重构</text>
  <text x="300" y="540" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">从人月到评估函数，</text>
  <text x="300" y="565" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">从静态原型到 Live Demo</text>

  <!-- Branch 4: 人才结构 (right, green) -->
  <line x1="945" y1="470" x2="1220" y2="530" stroke="#8A9A5B" stroke-width="2"/>
  <rect x="1130" y="470" width="340" height="120" rx="12" fill="#E0E4CC" stroke="#8A9A5B" stroke-width="2"/>
  <text x="1300" y="508" text-anchor="middle" font-family="SimSun, serif" font-size="21" font-weight="bold" fill="#333333">人才结构升级</text>
  <text x="1300" y="540" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">从程序员到 X Engineer，</text>
  <text x="1300" y="565" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">即产品架构师</text>

  <!-- Branch 5: 组织终局 (bottom, purple/mix use blue again but centered) -->
  <line x1="800" y1="540" x2="800" y2="670" stroke="#8A8AAE" stroke-width="2"/>
  <rect x="560" y="670" width="480" height="120" rx="12" fill="#D2D2E0" stroke="#8A8AAE" stroke-width="2"/>
  <text x="800" y="708" text-anchor="middle" font-family="SimSun, serif" font-size="21" font-weight="bold" fill="#333333">组织终局</text>
  <text x="800" y="740" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">敢于重构自身，</text>
  <text x="800" y="765" text-anchor="middle" font-family="SimSun, serif" font-size="17" fill="#333333">成为 AI 时代的"新物种"</text>

  <!-- Citation -->
  <text x="800" y="850" text-anchor="middle" font-family="SimSun, serif" font-size="18" fill="#999999">—— 许式伟《AI 时代，企业要学会重新想象自己》</text>
</svg>
