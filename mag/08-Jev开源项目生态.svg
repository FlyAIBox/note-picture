<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jev 开源项目生态</title>
  <desc id="desc">展示围绕 Jev 出现的浏览器、上下文压缩、电脑控制、模型路由、数据库、游戏和无人机项目。</desc>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="70" y="72" font-family="SimSun,'Songti SC',serif" font-size="42" font-weight="700" fill="#20262C">Jev 开源生态：决策层正在进入不同软件</text>
  <text x="72" y="112" font-family="'Times New Roman',SimSun,serif" font-size="22" fill="#59636C">From browser actions to model routing and embodied experiments</text>

  <rect x="60" y="155" width="270" height="170" rx="18" fill="#C4DCE6"/>
  <text x="195" y="205" text-anchor="middle" font-family="'Times New Roman',serif" font-size="25" font-weight="700" fill="#20262C">jev-ultrafast</text>
  <text x="195" y="250" text-anchor="middle" font-family="SimSun,serif" font-size="22" fill="#37434C">浏览器动作选择</text>
  <text x="195" y="288" text-anchor="middle" font-family="'Times New Roman',serif" font-size="20" fill="#59636C">i. am. speed.</text>

  <rect x="355" y="155" width="270" height="170" rx="18" fill="#E0E4CC"/>
  <text x="490" y="205" text-anchor="middle" font-family="'Times New Roman',serif" font-size="25" font-weight="700" fill="#20262C">SemIf</text>
  <text x="490" y="250" text-anchor="middle" font-family="SimSun,serif" font-size="22" fill="#37434C">开放模型语义判断</text>
  <text x="490" y="288" text-anchor="middle" font-family="SimSun,serif" font-size="20" fill="#59636C">家用显卡实验</text>

  <rect x="650" y="155" width="270" height="170" rx="18" fill="#FBE7A6"/>
  <text x="785" y="205" text-anchor="middle" font-family="'Times New Roman',serif" font-size="23" font-weight="700" fill="#20262C">fast-jev-compaction</text>
  <text x="785" y="250" text-anchor="middle" font-family="SimSun,serif" font-size="22" fill="#37434C">上下文保留与淘汰</text>
  <text x="785" y="288" text-anchor="middle" font-family="SimSun,serif" font-size="20" fill="#59636C">保留内容维持原文</text>

  <rect x="945" y="155" width="275" height="170" rx="18" fill="#FFBFBF"/>
  <text x="1083" y="205" text-anchor="middle" font-family="'Times New Roman',serif" font-size="22" font-weight="700" fill="#20262C">typesafe-computer-use</text>
  <text x="1083" y="250" text-anchor="middle" font-family="SimSun,serif" font-size="22" fill="#37434C">macOS 电脑控制</text>
  <text x="1083" y="288" text-anchor="middle" font-family="SimSun,serif" font-size="20" fill="#59636C">识别屏幕并选择动作</text>

  <rect x="60" y="365" width="270" height="170" rx="18" fill="#D2D2E0"/>
  <text x="195" y="415" text-anchor="middle" font-family="'Times New Roman',serif" font-size="25" font-weight="700" fill="#20262C">jev-router</text>
  <text x="195" y="460" text-anchor="middle" font-family="SimSun,serif" font-size="22" fill="#37434C">模型成本路由</text>
  <text x="195" y="498" text-anchor="middle" font-family="'Times New Roman',SimSun,serif" font-size="20" fill="#59636C">Claude Code</text>

  <rect x="355" y="365" width="270" height="170" rx="18" fill="#C4DCE6"/>
  <text x="490" y="415" text-anchor="middle" font-family="'Times New Roman',serif" font-size="25" font-weight="700" fill="#20262C">pg-jev</text>
  <text x="490" y="460" text-anchor="middle" font-family="SimSun,serif" font-size="22" fill="#37434C">自然语言查询数据表</text>
  <text x="490" y="498" text-anchor="middle" font-family="'Times New Roman',serif" font-size="20" fill="#59636C">PostgreSQL extension</text>

  <rect x="650" y="365" width="270" height="170" rx="18" fill="#E0E4CC"/>
  <text x="785" y="415" text-anchor="middle" font-family="'Times New Roman',serif" font-size="24" font-weight="700" fill="#20262C">typesafe-mario</text>
  <text x="785" y="460" text-anchor="middle" font-family="SimSun,serif" font-size="22" fill="#37434C">结构化状态玩游戏</text>
  <text x="785" y="498" text-anchor="middle" font-family="SimSun,serif" font-size="20" fill="#59636C">《超级马里奥》</text>

  <rect x="945" y="365" width="275" height="170" rx="18" fill="#FBE7A6"/>
  <text x="1083" y="415" text-anchor="middle" font-family="'Times New Roman',serif" font-size="25" font-weight="700" fill="#20262C">jev-drone</text>
  <text x="1083" y="460" text-anchor="middle" font-family="SimSun,serif" font-size="22" fill="#37434C">无人机动作判断</text>
  <text x="1083" y="498" text-anchor="middle" font-family="'Times New Roman',SimSun,serif" font-size="20" fill="#59636C">MuJoCo · 2.5Hz</text>

  <rect x="60" y="590" width="1160" height="78" rx="16" fill="#D2D2E0"/>
  <text x="640" y="638" text-anchor="middle" font-family="SimSun,serif" font-size="24" fill="#20262C">同一个核心模式：把复杂状态变成有限动作，再让代码执行被选中的分支</text>
</svg>
