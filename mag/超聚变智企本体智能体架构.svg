<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">超聚变智企本体智能体架构</title>
  <desc id="svgDesc">以企业业务本体为核心，连接交互层、智能协同层、流程与智能体双执行层、平台层和模型算力基础设施。</desc>
  <defs>
    <style>
      .all { font-family: 'Times New Roman', 'Songti SC', SimSun, serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #526078; }
      .section { font-size: 24px; font-weight: 700; }
      .layer { font-size: 19px; font-weight: 700; }
      .card-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #526078; }
      .center { text-anchor: middle; dominant-baseline: middle; }
      .left { text-anchor: start; dominant-baseline: middle; }
      .box { stroke: #6E7890; stroke-width: 1.4; }
      .inner { fill: #FFFFFF; stroke: #7A849A; stroke-width: 1.2; }
      .dash { fill: none; stroke: #7A849A; stroke-width: 1.4; stroke-dasharray: 7 6; }
      .flow { fill: none; stroke: #44526D; stroke-width: 2.2; marker-end: url(#arrow); }
      .thin-flow { fill: none; stroke: #6E7890; stroke-width: 1.6; marker-end: url(#arrowSmall); }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1D2A44" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44526D"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E7890"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F7F8FA"/>
  <g class="all">
    <text class="title center" x="800" y="48">超聚变「智企」本体智能体架构</text>
    <text class="subtitle center" x="800" y="84">统一业务语义 · 协同智能决策 · 连接流程与行动</text>

    <!-- Left: three cores -->
    <text class="section center" x="165" y="130">企业进化的三大核心</text>

    <g filter="url(#shadow)">
      <rect class="box" x="35" y="158" width="260" height="150" rx="16" fill="#C4DCE6"/>
      <circle cx="65" cy="188" r="18" fill="#FFFFFF" stroke="#6E7890"/>
      <text class="card-title center" x="65" y="188">1</text>
      <text class="card-title center" x="165" y="195">企业业务大脑</text>
      <text class="body center" x="165" y="231">跨领域分析与任务规划</text>
      <text class="body center" x="165" y="257">连接决策、审批与执行</text>
      <text class="small center" x="165" y="284">从智能分析走向闭环行动</text>
    </g>

    <g filter="url(#shadow)">
      <rect class="box" x="35" y="328" width="260" height="150" rx="16" fill="#FFBFBF"/>
      <circle cx="65" cy="358" r="18" fill="#FFFFFF" stroke="#6E7890"/>
      <text class="card-title center" x="65" y="358">2</text>
      <text class="card-title center" x="165" y="365">企业业务本体</text>
      <text class="body center" x="165" y="401">统一对象、关系与状态</text>
      <text class="body center" x="165" y="427">定义规则、动作与权限</text>
      <text class="small center" x="165" y="454">重构业务活动与流程</text>
    </g>

    <g filter="url(#shadow)">
      <rect class="box" x="35" y="498" width="260" height="150" rx="16" fill="#E0E4CC"/>
      <circle cx="65" cy="528" r="18" fill="#FFFFFF" stroke="#6E7890"/>
      <text class="card-title center" x="65" y="528">3</text>
      <text class="card-title center" x="165" y="535">模型与算力系统</text>
      <text class="body center" x="165" y="571">统一模型、数据与知识供给</text>
      <text class="body center" x="165" y="597">适配不同 AI 应用负载</text>
      <text class="small center" x="165" y="624">安全、弹性、可治理</text>
    </g>

    <!-- Center: architecture -->
    <text class="section center" x="805" y="130">企业本体智能体技术栈</text>

    <!-- Interaction layer -->
    <rect class="box" x="335" y="150" width="940" height="76" rx="14" fill="#C4DCE6"/>
    <rect x="355" y="166" width="135" height="44" rx="10" fill="#FFFFFF" stroke="#7A849A"/>
    <text class="layer center" x="422" y="188">GUI</text>
    <rect x="505" y="166" width="750" height="44" rx="10" fill="#FFFFFF" stroke="#7A849A"/>
    <text class="layer center" x="650" y="188">AI Workspace</text>
    <text class="body center" x="955" y="188">检索　分析　指令　预警</text>
    <text class="small left" x="350" y="138">交互层</text>

    <!-- Agentic coordination layer -->
    <rect class="box" x="335" y="244" width="940" height="92" rx="14" fill="#FFBFBF"/>
    <text class="small left" x="350" y="233">智能协同层 · Agentic AI</text>
    <text class="layer center" x="805" y="274">企业大脑</text>
    <text class="body center" x="805" y="305">非标准 · 动态 · 跨域 · 多维综合分析与决策协同</text>

    <!-- Interface strip -->
    <rect class="box" x="335" y="352" width="940" height="46" rx="12" fill="#FBE7A6"/>
    <text class="card-title center" x="805" y="376">API / CLI　·　MCP　·　A2A　·　API / MCP</text>
    <path class="thin-flow" d="M 560 336 L 560 350"/>
    <path class="thin-flow" d="M 805 336 L 805 350"/>
    <path class="thin-flow" d="M 1050 336 L 1050 350"/>

    <!-- Execution layer -->
    <rect class="box" x="335" y="414" width="940" height="246" rx="14" fill="#E0E4CC"/>
    <text class="small left" x="350" y="405">执行层 · 流程与智能体双架构</text>

    <rect class="inner" x="355" y="435" width="260" height="142" rx="12"/>
    <text class="card-title center" x="485" y="462">确定性流程应用</text>
    <text class="body center" x="485" y="494">业务流程编排</text>
    <text class="body center" x="485" y="520">ERP Core 服务</text>
    <text class="small center" x="485" y="550">审批 · 排产 · 交易 · 写回</text>

    <rect class="inner" x="660" y="435" width="290" height="142" rx="12"/>
    <text class="card-title center" x="805" y="462">活动级智能体</text>
    <text class="body center" x="805" y="494">异常理解与动态规划</text>
    <text class="body center" x="805" y="520">跨系统分析与方案生成</text>
    <text class="small center" x="805" y="550">调用工具 · 协同执行 · 解释反馈</text>

    <rect class="inner" x="995" y="435" width="260" height="142" rx="12"/>
    <text class="card-title center" x="1125" y="462">企业存量系统</text>
    <text class="body center" x="1125" y="494">Any App</text>
    <text class="body center" x="1125" y="520">Any Agent</text>
    <text class="small center" x="1125" y="550">Any Knowledge</text>

    <path class="flow" d="M 616 506 L 653 506"/>
    <path class="flow" d="M 950 506 L 988 506"/>
    <path class="thin-flow" d="M 660 533 C 640 590, 635 590, 615 545"/>

    <rect class="box" x="355" y="596" width="900" height="46" rx="10" fill="#D2D2E0"/>
    <text class="layer center" x="805" y="620">企业统一本体层：对象 · 关系 · 状态 · 规则 · 动作 · 权限</text>
    <path class="thin-flow" d="M 485 577 L 485 594"/>
    <path class="thin-flow" d="M 805 577 L 805 594"/>
    <path class="thin-flow" d="M 1125 577 L 1125 594"/>

    <!-- Platform -->
    <rect class="box" x="335" y="676" width="940" height="76" rx="14" fill="#D2D2E0"/>
    <text class="small left" x="350" y="666">平台层 · 可信 AI</text>
    <text class="body center" x="805" y="704">云原生　应用编排　AI 使能　本体开发　数据开发　集成平台　安全与治理</text>
    <text class="small center" x="805" y="731">统一开发、发布、运行、审计与版本管理</text>

    <!-- Infrastructure -->
    <rect class="box" x="335" y="770" width="940" height="82" rx="14" fill="#FBE7A6"/>
    <text class="small left" x="350" y="760">基础设施层</text>
    <rect x="355" y="788" width="280" height="46" rx="10" fill="#FFFFFF" stroke="#7A849A"/>
    <text class="body center" x="495" y="812">大模型：DeepSeek · Qwen · OpenAI</text>
    <rect x="650" y="788" width="280" height="46" rx="10" fill="#FFFFFF" stroke="#7A849A"/>
    <text class="body center" x="790" y="812">第三方数据与知识</text>
    <rect x="945" y="788" width="310" height="46" rx="10" fill="#FFFFFF" stroke="#7A849A"/>
    <text class="body center" x="1100" y="812">企业 AI 基础设施与算力</text>

    <!-- Right: business value -->
    <text class="section center" x="1435" y="130">重构生产与经营活动</text>

    <rect class="box" x="1310" y="158" width="250" height="112" rx="16" fill="#C4DCE6" filter="url(#shadow)"/>
    <text class="card-title center" x="1435" y="187">面向业务</text>
    <text class="body center" x="1435" y="220">可视化业务编排</text>
    <text class="small center" x="1435" y="246">快速构建与调整流程</text>

    <rect class="box" x="1310" y="289" width="250" height="112" rx="16" fill="#FFBFBF" filter="url(#shadow)"/>
    <text class="card-title center" x="1435" y="318">面向经营</text>
    <text class="body center" x="1435" y="351">跨域分析与根因追踪</text>
    <text class="small center" x="1435" y="377">仿真、预测与决策辅助</text>

    <rect class="box" x="1310" y="420" width="250" height="112" rx="16" fill="#E0E4CC" filter="url(#shadow)"/>
    <text class="card-title center" x="1435" y="449">面向研发</text>
    <text class="body center" x="1435" y="482">企业 AI 数字员工</text>
    <text class="small center" x="1435" y="508">AI 协同与 AI Native 开发</text>

    <rect class="box" x="1310" y="551" width="250" height="112" rx="16" fill="#D2D2E0" filter="url(#shadow)"/>
    <text class="card-title center" x="1435" y="580">面向体验</text>
    <text class="body center" x="1435" y="613">企业级智能助理</text>
    <text class="small center" x="1435" y="639">自然语言驱动人机协作</text>

    <rect class="box" x="1310" y="682" width="250" height="170" rx="16" fill="#FBE7A6" filter="url(#shadow)"/>
    <text class="card-title center" x="1435" y="716">设计原则</text>
    <text class="body left" x="1334" y="750">• 本体统一业务语言</text>
    <text class="body left" x="1334" y="779">• 智能体处理动态任务</text>
    <text class="body left" x="1334" y="808">• 流程保障确定性执行</text>
    <text class="body left" x="1334" y="837">• 安全治理贯穿全栈</text>
  </g>
</svg>
