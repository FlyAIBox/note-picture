<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jev 落地路线图</title><desc id="desc">从高频判断点、答案空间、离线评测、分级兜底到小流量上线的五步路线。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3B4650"/></marker></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="70" y="72" font-family="SimSun,'Songti SC',serif" font-size="42" font-weight="700" fill="#20262C">从试玩到生产：五步，不要一步到位</text>
  <text x="72" y="112" font-family="'Times New Roman',SimSun,serif" font-size="22" fill="#59636C">Start with one repeated decision, not an entire agent</text>
  <g font-family="SimSun,serif" fill="#20262C">
    <rect x="55" y="190" width="205" height="260" rx="18" fill="#C4DCE6"/>
    <text x="158" y="238" text-anchor="middle" font-family="'Times New Roman',serif" font-size="34" font-weight="700">01</text>
    <text x="158" y="288" text-anchor="middle" font-size="24" font-weight="700">找判断点</text>
    <text x="158" y="340" text-anchor="middle" font-size="19">高调用量</text><text x="158" y="374" text-anchor="middle" font-size="19">答案空间明确</text><text x="158" y="408" text-anchor="middle" font-size="19">误判代价可控</text>
    <rect x="300" y="190" width="205" height="260" rx="18" fill="#E0E4CC"/>
    <text x="403" y="238" text-anchor="middle" font-family="'Times New Roman',serif" font-size="34" font-weight="700">02</text>
    <text x="403" y="288" text-anchor="middle" font-size="24" font-weight="700">定义选项</text>
    <text x="403" y="340" text-anchor="middle" font-size="19">互斥边界</text><text x="403" y="374" text-anchor="middle" font-size="19">正反例</text><text x="403" y="408" text-anchor="middle" font-size="19">人工出口</text>
    <rect x="545" y="190" width="205" height="260" rx="18" fill="#FBE7A6"/>
    <text x="648" y="238" text-anchor="middle" font-family="'Times New Roman',serif" font-size="34" font-weight="700">03</text>
    <text x="648" y="288" text-anchor="middle" font-size="24" font-weight="700">离线评测</text>
    <text x="648" y="340" text-anchor="middle" font-size="19">历史真值集</text><text x="648" y="374" text-anchor="middle" font-size="19">错例切片</text><text x="648" y="408" text-anchor="middle" font-size="19">版本固定</text>
    <rect x="790" y="190" width="205" height="260" rx="18" fill="#FFBFBF"/>
    <text x="893" y="238" text-anchor="middle" font-family="'Times New Roman',serif" font-size="34" font-weight="700">04</text>
    <text x="893" y="288" text-anchor="middle" font-size="24" font-weight="700">设计兜底</text>
    <text x="893" y="340" text-anchor="middle" font-size="19">低风险自动</text><text x="893" y="374" text-anchor="middle" font-size="19">复杂交给 LLM</text><text x="893" y="408" text-anchor="middle" font-size="19">高风险找人</text>
    <rect x="1035" y="190" width="190" height="260" rx="18" fill="#D2D2E0"/>
    <text x="1130" y="238" text-anchor="middle" font-family="'Times New Roman',serif" font-size="34" font-weight="700">05</text>
    <text x="1130" y="288" text-anchor="middle" font-size="24" font-weight="700">小流量上线</text>
    <text x="1130" y="340" text-anchor="middle" font-size="19">记录模型版本</text><text x="1130" y="374" text-anchor="middle" font-size="19">监控误判</text><text x="1130" y="408" text-anchor="middle" font-size="19">逐步扩量</text>
  </g>
  <g stroke="#3B4650" stroke-width="3" marker-end="url(#a)"><line x1="260" y1="320" x2="290" y2="320"/><line x1="505" y1="320" x2="535" y2="320"/><line x1="750" y1="320" x2="780" y2="320"/><line x1="995" y1="320" x2="1025" y2="320"/></g>
  <rect x="55" y="520" width="1170" height="120" rx="18" fill="#E0E4CC"/>
  <text x="640" y="567" text-anchor="middle" font-family="SimSun,serif" font-size="26" font-weight="700" fill="#20262C">最小实验：一条决策链 + 一百条历史样本 + 一套明确的人工兜底</text>
  <text x="640" y="609" text-anchor="middle" font-family="SimSun,serif" font-size="21" fill="#59636C">先验证业务收益与错判成本，再讨论是否扩展到整条工作流</text>
</svg>
