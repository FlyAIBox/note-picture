<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: '宋体', SimSun, serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .section-text { font-family: '宋体', SimSun, serif; font-size: 14px; fill: #34495e; }
      .english-text { font-family: 'Times New Roman', serif; font-size: 12px; fill: #34495e; }
      .formula-text { font-family: 'Times New Roman', serif; font-size: 11px; fill: #8b4513; }
      .process-box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .input-box { fill: #e8f5e8; stroke: #27ae60; stroke-width: 2; }
      .output-box { fill: #fdf2e9; stroke: #e67e22; stroke-width: 2; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dashed-arrow { stroke: #7f8c8d; stroke-width: 1.5; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead-gray); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title-text">GPTQ 量化算法结构图</text>
  <text x="500" y="50" text-anchor="middle" class="english-text">(Generative Pre-trained Transformer Quantization)</text>

  <!-- Input Layer -->
  <rect x="50" y="80" width="150" height="60" class="input-box" rx="5"/>
  <text x="125" y="105" text-anchor="middle" class="section-text">原始权重矩阵</text>
  <text x="125" y="125" text-anchor="middle" class="formula-text">W ∈ R^(n×m)</text>

  <!-- Layer-wise Processing -->
  <rect x="300" y="80" width="180" height="60" class="process-box" rx="5"/>
  <text x="390" y="105" text-anchor="middle" class="section-text">逐层处理</text>
  <text x="390" y="125" text-anchor="middle" class="english-text">Layer-by-layer Processing</text>

  <!-- Block Partition -->
  <rect x="580" y="80" width="160" height="60" class="process-box" rx="5"/>
  <text x="660" y="105" text-anchor="middle" class="section-text">权重分块</text>
  <text x="660" y="125" text-anchor="middle" class="formula-text">Block size: 128</text>

  <!-- Hessian Computation -->
  <rect x="120" y="200" width="200" height="80" class="process-box" rx="5"/>
  <text x="220" y="225" text-anchor="middle" class="section-text">计算Hessian逆矩阵</text>
  <text x="220" y="245" text-anchor="middle" class="formula-text">H = 2X^T X</text>
  <text x="220" y="265" text-anchor="middle" class="formula-text">H^(-1) = (H + λI)^(-1)</text>

  <!-- Weight Selection -->
  <rect x="400" y="200" width="180" height="80" class="process-box" rx="5"/>
  <text x="490" y="225" text-anchor="middle" class="section-text">权重选择与量化</text>
  <text x="490" y="245" text-anchor="middle" class="english-text">Weight Selection</text>
  <text x="490" y="265" text-anchor="middle" class="formula-text">w_q = Round(w/s) × s</text>

  <!-- Error Compensation -->
  <rect x="650" y="200" width="200" height="80" class="process-box" rx="5"/>
  <text x="750" y="220" text-anchor="middle" class="section-text">误差补偿</text>
  <text x="750" y="240" text-anchor="middle" class="english-text">Error Compensation</text>
  <text x="750" y="255" text-anchor="middle" class="formula-text">e = w - w_q</text>
  <text x="750" y="270" text-anchor="middle" class="formula-text">W' = W - (e/H_ii) × H_i</text>

  <!-- Iteration Process -->
  <rect x="300" y="350" width="220" height="60" class="process-box" rx="5"/>
  <text x="410" y="375" text-anchor="middle" class="section-text">迭代处理块内所有权重</text>
  <text x="410" y="395" text-anchor="middle" class="english-text">Iterate All Weights in Block</text>

  <!-- Final Output -->
  <rect x="600" y="350" width="160" height="60" class="output-box" rx="5"/>
  <text x="680" y="375" text-anchor="middle" class="section-text">量化后权重</text>
  <text x="680" y="395" text-anchor="middle" class="formula-text">W_quantized</text>

  <!-- Performance Metrics -->
  <rect x="150" y="480" width="180" height="100" class="process-box" rx="5"/>
  <text x="240" y="505" text-anchor="middle" class="section-text">性能特点</text>
  <text x="240" y="525" text-anchor="middle" class="english-text">• Minimal accuracy loss</text>
  <text x="240" y="545" text-anchor="middle" class="english-text">• 4-bit quantization</text>
  <text x="240" y="565" text-anchor="middle" class="english-text">• GPU memory efficient</text>

  <!-- Key Formulas -->
  <rect x="400" y="480" width="220" height="100" class="process-box" rx="5"/>
  <text x="510" y="505" text-anchor="middle" class="section-text">核心公式</text>
  <text x="510" y="525" text-anchor="middle" class="formula-text">Loss = ||XW - XW_q||²_F</text>
  <text x="510" y="545" text-anchor="middle" class="formula-text">W_opt = W - H^(-1)∇L</text>
  <text x="510" y="565" text-anchor="middle" class="formula-text">Greedy Selection Order</text>

  <!-- Advantages -->
  <rect x="680" y="480" width="180" height="100" class="output-box" rx="5"/>
  <text x="770" y="505" text-anchor="middle" class="section-text">算法优势</text>
  <text x="770" y="525" text-anchor="middle" class="english-text">• Post-training method</text>
  <text x="770" y="545" text-anchor="middle" class="english-text">• No retraining needed</text>
  <text x="770" y="565" text-anchor="middle" class="english-text">• Fast quantization</text>

  <!-- Arrows -->
  <line x1="200" y1="110" x2="300" y2="110" class="arrow"/>
  <line x1="480" y1="110" x2="580" y2="110" class="arrow"/>
  <line x1="660" y1="140" x2="660" y2="180" class="arrow"/>
  <line x1="220" y1="140" x2="220" y2="180" class="arrow"/>
  <line x1="490" y1="140" x2="490" y2="180" class="arrow"/>
  
  <line x1="320" y1="240" x2="400" y2="240" class="arrow"/>
  <line x1="580" y1="240" x2="650" y2="240" class="arrow"/>
  
  <line x1="490" y1="280" x2="490" y2="330" class="arrow"/>
  <line x1="520" y1="380" x2="600" y2="380" class="arrow"/>
  
  <!-- Feedback loop -->
  <path d="M 750 280 Q 780 320 680 340 Q 580 350 410 330" class="dashed-arrow"/>
  <text x="650" y="320" class="english-text" font-size="10">Feedback Loop</text>

  <!-- Block iteration indicator -->
  <path d="M 300 380 Q 250 420 300 450 Q 350 480 410 450" class="dashed-arrow"/>
  <text x="280" y="440" class="english-text" font-size="10">Next Block</text>

</svg>