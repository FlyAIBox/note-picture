<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="42" font-family="SimSun, 宋体" font-size="24" font-weight="bold" fill="#1B2A4A" text-anchor="middle">目标制循环:把"何时收工"交给评估器</text>

  <rect x="40" y="100" width="150" height="70" rx="10" fill="#FFBFBF"/>
  <text x="115" y="128" font-family="SimSun, 宋体" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="middle">定义目标</text>
  <text x="115" y="148" font-family="Times New Roman" font-size="11" fill="#1B2A4A" text-anchor="middle">/goal + 完成标准</text>
  <text x="115" y="163" font-family="Times New Roman" font-size="11" fill="#1B2A4A" text-anchor="middle">+ 轮次上限</text>

  <path d="M 190 135 L 227 135" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah3)"/>

  <rect x="230" y="100" width="150" height="70" rx="10" fill="#C4DCE6"/>
  <text x="305" y="128" font-family="SimSun, 宋体" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="middle">Claude 尝试</text>
  <text x="305" y="148" font-family="Times New Roman" font-size="11" fill="#1B2A4A" text-anchor="middle">Attempt Task</text>
  <text x="305" y="163" font-family="SimSun, 宋体" font-size="11" fill="#1B2A4A" text-anchor="middle">修改并测试</text>

  <path d="M 380 135 L 417 135" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah3)"/>

  <rect x="420" y="100" width="170" height="70" rx="10" fill="#D2D2E0"/>
  <text x="505" y="128" font-family="SimSun, 宋体" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="middle">评估器检查</text>
  <text x="505" y="148" font-family="Times New Roman" font-size="11" fill="#1B2A4A" text-anchor="middle">Evaluator Model</text>
  <text x="505" y="163" font-family="SimSun, 宋体" font-size="11" fill="#1B2A4A" text-anchor="middle">对照完成标准打分</text>

  <path d="M 505 170 L 505 210" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah3)"/>

  <rect x="405" y="213" width="200" height="60" rx="10" fill="#FBE7A6"/>
  <text x="505" y="238" font-family="SimSun, 宋体" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="middle">目标达成？</text>
  <text x="505" y="258" font-family="Times New Roman" font-size="11" fill="#1B2A4A" text-anchor="middle">Goal Met OR Max Turns</text>

  <path d="M 605 243 L 660 243" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah3)"/>
  <text x="632" y="233" font-family="SimSun, 宋体" font-size="12" fill="#1B7A3D" text-anchor="middle">是</text>
  <rect x="660" y="213" width="110" height="60" rx="10" fill="#E0E4CC"/>
  <text x="715" y="238" font-family="SimSun, 宋体" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="middle">结束循环</text>
  <text x="715" y="258" font-family="Times New Roman" font-size="11" fill="#1B2A4A" text-anchor="middle">Exit</text>

  <path d="M 405 243 L 305 243 L 305 172" stroke="#8C8C8C" stroke-width="2.5" marker-end="url(#ah3)"/>
  <text x="355" y="233" font-family="SimSun, 宋体" font-size="12" fill="#B23B3B" text-anchor="middle">否，继续迭代</text>

  <rect x="60" y="320" width="680" height="90" rx="10" fill="#FAFBF6" stroke="#E0E4CC" stroke-width="1.5"/>
  <text x="80" y="350" font-family="SimSun, 宋体" font-size="14" font-weight="bold" fill="#1B2A4A">示例</text>
  <text x="80" y="378" font-family="Times New Roman" font-size="13" fill="#333333">/goal get the homepage Lighthouse score to 90 or above, stop after 5 tries.</text>
  <text x="80" y="400" font-family="SimSun, 宋体" font-size="12" fill="#7A7A7A">确定性指标（如测试通过数、评分阈值）最适合作为完成标准</text>

  <defs>
    <marker id="ah3" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8C8C8C"/>
    </marker>
  </defs>
</svg>